name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt update -qq
          sudo apt install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install && npm run build
      - run: cargo install tauri-cli --version "^2"
      - run: cargo tauri build
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: audit-desktop-x86_64
          path: src-tauri/target/release/bundle/

  build-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build in Docker (ubuntu 23.10, glibc 2.38)
        run: |
          cat > /tmp/Dockerfile << 'DOCKER'
FROM arm64v8/ubuntu:23.10
ENV DEBIAN_FRONTEND=noninteractive
RUN apt update -qq && apt install -y -qq \
  build-essential pkg-config curl git \
  libwebkit2gtk-4.1-dev libgtk-3-dev \
  libayatana-appindicator3-dev librsvg2-dev
RUN curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
ENV PATH="/root/.cargo/bin:/usr/local/bin:${PATH}"
RUN curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt install -y -qq nodejs
WORKDIR /app
COPY . .
RUN npm install && npm run build
RUN cargo install tauri-cli --version "^2" 2>&1 | tail -5
RUN cargo tauri build 2>&1
DOCKER
          docker build -t audit-arm -f /tmp/Dockerfile . 2>&1 | tail -20
      - name: Extract artifacts
        run: |
          docker run --rm -v $PWD:/out audit-arm \
            bash -c "cp -r /app/src-tauri/target/release/bundle/* /out/bundle/ 2>/dev/null; echo 'done'"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-desktop-aarch64
          path: bundle/
