name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update -qq && sudo apt install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Zig + cargo-zigbuild
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar xJ
          sudo mv zig-linux-x86_64-0.13.0 /usr/local/lib/zig-0.13.0
          sudo ln -s /usr/local/lib/zig-0.13.0/zig /usr/local/bin/zig
          zig version
          cargo install cargo-zigbuild -q 2>&1 | tail -1
      - run: npm install && npm run build
      - name: Build with zigbuild (glibc 2.28)
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28
        working-directory: src-tauri
      - name: Check glibc dependency
        run: |
          BIN=src-tauri/target/x86_64-unknown-linux-gnu/release/audit-desktop
          file $BIN
          echo "--- glibc requirements ---"
          strings $BIN | grep "GLIBC_2\." | sort -u -t'.' -k2 -n
      - uses: actions/upload-artifact@v4
        with:
          name: audit-desktop-x86_64
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/audit-desktop

  build-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update -qq && sudo apt install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Zig + cargo-zigbuild
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-aarch64-0.13.0.tar.xz | tar xJ
          sudo mv zig-linux-aarch64-0.13.0 /usr/local/lib/zig-0.13.0
          sudo ln -s /usr/local/lib/zig-0.13.0/zig /usr/local/bin/zig
          zig version
          cargo install cargo-zigbuild -q 2>&1 | tail -1
      - run: npm install && npm run build
      - name: Build with zigbuild (glibc 2.28)
        run: cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.28
        working-directory: src-tauri
      - name: Check glibc dependency
        run: |
          BIN=src-tauri/target/aarch64-unknown-linux-gnu/release/audit-desktop
          file $BIN
          echo "--- glibc requirements ---"
          strings $BIN | grep "GLIBC_2\." | sort -u -t'.' -k2 -n
      - uses: actions/upload-artifact@v4
        with:
          name: audit-desktop-aarch64
          path: src-tauri/target/aarch64-unknown-linux-gnu/release/audit-desktop
