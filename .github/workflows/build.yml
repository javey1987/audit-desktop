name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt update -qq
          sudo apt install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Zig
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar xJ
          sudo mv zig-linux-x86_64-0.13.0 /usr/local/lib/zig-0.13.0
          sudo ln -s /usr/local/lib/zig-0.13.0/zig /usr/local/bin/zig
          zig version
      - run: npm install && npm run build
      - name: Build binary (glibc 2.28 compat)
        run: |
          cargo install tauri-cli --version "^2"
          CC="zig cc -target x86_64-linux-gnu.2.28" \
            CXX="zig c++ -target x86_64-linux-gnu.2.28" \
            cargo tauri build
        working-directory: src-tauri
      - name: Check glibc version
        run: |
          echo "=== x86_64 binary info ==="
          file src-tauri/target/release/audit-desktop
          echo "--- glibc requirements ---"
          strings src-tauri/target/release/audit-desktop | grep "GLIBC_2\." | sort -u || echo "binary not found"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-desktop-x86_64
          path: src-tauri/target/release/bundle/

  build-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Zig
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-aarch64-0.13.0.tar.xz | tar xJ
          sudo mv zig-linux-aarch64-0.13.0 /usr/local/lib/zig-0.13.0
          sudo ln -s /usr/local/lib/zig-0.13.0/zig /usr/local/bin/zig
          zig version
      - run: npm install && npm run build
      - name: Build binary (glibc 2.28 compat)
        run: |
          cargo install tauri-cli --version "^2"
          CC="zig cc -target aarch64-linux-gnu.2.28" \
            CXX="zig c++ -target aarch64-linux-gnu.2.28" \
            cargo tauri build
        working-directory: src-tauri
      - name: Copy binary to release
        run: |
          cp src-tauri/target/release/audit-desktop .
          file audit-desktop
          echo "---"
          # Check what glibc versions the binary needs
          strings audit-desktop | grep "GLIBC_2\." | sort -u
      - uses: actions/upload-artifact@v4
        with:
          name: audit-desktop-aarch64
          path: src-tauri/target/release/bundle/
