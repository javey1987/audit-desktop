[package]
name = "desensitize-cli"
version = "0.1.0"
edition = "2021"
description = "脱敏引擎 CLI 原型 — 扫描敏感数据 → 替换为标记 → 还原"

[[bin]]
name = "desense"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
regex = "1"

# 多格式解析
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.31"
calamine = "0.26"
csv = "1.3"
